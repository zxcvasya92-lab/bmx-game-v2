<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Street Rider BMX</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101820;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{display:block}
#hud{position:fixed;top:8px;left:120px;color:#fff;font-weight:800;text-shadow:0 2px 0 #0008;pointer-events:none}
#sc{font-size:26px}#tr{font-size:18px;color:#ffd23f;height:22px}#ms{font-size:20px;color:#7dffb2;height:26px}
#bal{width:140px;height:8px;background:#0006;border-radius:4px;margin-top:4px;position:relative;visibility:hidden}
#bal b{position:absolute;top:-3px;left:67px;width:6px;height:14px;background:#7dffb2;border-radius:3px}
.c{position:fixed;box-sizing:border-box;border-radius:50%;background:#3339;border:2px solid #ffffffb0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.c.on{background:#ffffff66}
#stick{left:36px;bottom:30px;width:130px;height:130px}
#knob{width:56px;height:56px;pointer-events:none;background:#ffffff55}
#dia{position:fixed;right:30px;bottom:34px;width:152px;height:152px}
#dia .c{position:absolute;width:54px;height:54px}
#bT{left:49px;top:0}#bX{left:49px;bottom:0}#bS{left:0;top:49px}#bO{right:0;top:49px}
#dp{position:fixed;right:212px;bottom:46px;width:120px;height:120px}
#dp .c{position:absolute;width:42px;height:42px;border-radius:8px;font-size:18px}
#dU{left:39px;top:0}#dD{left:39px;bottom:0}#dL{left:0;top:39px}#dR{right:0;top:39px}
.p{position:fixed;box-sizing:border-box;border-radius:14px;background:#3339;border:2px solid #ffffffb0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.p.on{background:#ffffff66}
#bL{left:14px;top:8px;width:84px;height:38px}#bR{right:14px;top:8px;width:84px;height:38px}
#bSe{left:calc(50% - 80px);bottom:8px;width:72px;height:28px}#bSt{left:calc(50% + 8px);bottom:8px;width:72px;height:28px}
</style></head><body>
<div id="hud"><div id="sc">0</div><div id="tr"></div><div id="ms"></div><div id="bal"><b></b></div></div>
<div class="c" id="stick"><div class="c" id="knob"></div></div>
<div id="dp"><div class="c" id="dU">▲</div><div class="c" id="dD">▼</div><div class="c" id="dL">◀</div><div class="c" id="dR">▶</div></div>
<div id="dia"><div class="c" id="bT">△</div><div class="c" id="bX">✕</div><div class="c" id="bS">□</div><div class="c" id="bO">○</div></div>
<div class="p" id="bL">L</div><div class="p" id="bR">R</div><div class="p" id="bSe">Select</div><div class="p" id="bSt">Start</div>
<script type="module" src="/src/main.js"></script></body></html>
